[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictum-asr"
version = "0.1.0"
description = "Wayland hotkey dictation CLI and daemon; native ASR/LLM fetched on first run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dictum contributors" }]
keywords = ["dictation", "wayland", "speech-to-text", "asr", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "sounddevice>=0.5",
  "typer>=0.12",
  "tqdm>=4.66",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-tqdm>=4.66",
]

[project.scripts]
dictum = "dictum.cli:app"

[project.urls]
Homepage = "https://github.com/hermitm0nk/dictum"
Repository = "https://github.com/hermitm0nk/dictum"
Issues = "https://github.com/hermitm0nk/dictum/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dictum"]

[tool.hatch.build.targets.wheel.force-include]
"src/dictum/data/dictum.service" = "dictum/data/dictum.service"
"src/dictum/py.typed" = "dictum/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src/dictum/**/*.py",
  "src/dictum/py.typed",
  "src/dictum/data/**",
  "tests/*.py",
  "examples/**",
  "scripts/*.sh",
  "LICENSE",
  "README.md",
  "AGENTS.md",
  "docs/**",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B027"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dictum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
