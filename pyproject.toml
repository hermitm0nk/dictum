[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictum"
version = "0.1.0"
description = "Wayland hotkey dictation CLI and daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dictum contributors" }]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "sounddevice>=0.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
dictum = "dictum.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dictum"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B027"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dictum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
