[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "dictum"
version = "0.1.0"
description = "Wayland hotkey dictation CLI and daemon with bundled native ASR/LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dictum contributors" }]
keywords = ["dictation", "wayland", "speech-to-text", "asr", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "sounddevice>=0.5",
  "typer>=0.12",
  "tqdm>=4.66",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
dictum = "dictum.cli:app"
dictum-daemon = "dictum.daemon:run_daemon"
dictum-once = "dictum.cli:once_callback"
dictum-toggle = "dictum.cli:toggle_callback"

[project.urls]
Homepage = "https://github.com/hermitm0nk/dictum"
Repository = "https://github.com/hermitm0nk/dictum"
Issues = "https://github.com/hermitm0nk/dictum/issues"

[tool.scikit-build]
wheel.packages = ["src/dictum"]
cmake.build-type = "Release"
cmake.args = []
sdist.include = [
  "CMakeLists.txt",
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "examples/**",
  "packaging/**",
  "src/dictum/*.py",
  "scripts/*.sh",
  "tests/*.py",
]
sdist.inclusion-mode = "manual"
sdist.exclude = [
  "*",
  ".pytest_cache/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "build/**",
  "dist/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B027"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dictum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
